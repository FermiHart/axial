name: Axial scope and static resources
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: axial-scope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tools/check-release-scope.py
      - run: python3 tools/check-site-resources.py
