name: Axial audit gate

on:
  push:
    branches: [main, 'audit/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: axial-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, release, sanitizers]
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normal C99 gate
        if: matrix.profile == 'normal'
        run: make -j2 gate
      - name: Optimized C99 gate
        if: matrix.profile == 'release'
        run: >-
          make -j2 BUILD=build-release
          CFLAGS='-std=c99 -Wall -Wextra -Werror -O2 -D_POSIX_C_SOURCE=200809L'
          gate
      - name: Address and undefined-behavior gate
        if: matrix.profile == 'sanitizers'
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: >-
          make -j2 BUILD=build-sanitize
          CFLAGS='-std=c99 -Wall -Wextra -Werror -O1 -g -D_POSIX_C_SOURCE=200809L -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -fno-pie -no-pie'
          LDFLAGS='-fsanitize=address,undefined -fno-sanitize-recover=all -no-pie'
          gate
