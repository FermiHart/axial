name: Games adapters
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    strategy:
      matrix:
        include:
          - {node: 20, os: ubuntu-latest}
          - {node: 22, os: ubuntu-latest}
          - {node: 24, os: ubuntu-latest}
          - {node: 24, os: ubuntu-24.04-arm}
          - {node: 24, os: macos-14}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '${{ matrix.node }}'
      - name: Native compiler fixture
        run: |
          node tools/portable-decision-build.cjs
          node tools/portable-numeric-build.cjs
      - name: Game adapters and portable regression
        run: node --test --test-concurrency=1 tests/games-*.test.cjs tests/invocation-context*.cjs tests/portable-decision*.cjs tests/portable-numeric*.test.cjs
      - name: Trust canon byte regression
        run: python3 tests/games-trust-canon.py
      - name: Seeded hostile input corpus
        run: node tools/games-fuzz.cjs
      - name: Informational local microbenchmark
        run: node tools/games-benchmark.cjs
      - name: Informational bounded actor queue workload
        run: node tools/games-budget-bench.cjs
      - name: Native numeric address/undefined/leak sanitizer corpus
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        env:
          AXIAL_NUMERIC_SANITIZERS: '1'
        run: node --test tests/portable-numeric-seeded.test.cjs
