name: Portable policy consumer gate
on:
  push:
    branches: [main]
    paths: ['src/**', 'vendor/**', 'include/**', 'runtime/**', 'tools/portable-policy*', 'tests/portable-policy*', 'tests/portable-policy/**', '.github/workflows/portable-policy.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: C reference and portable execution contract
        run: make gate-portable
